  - '@oxlint-tsgolint/win32-arm64@7.0.2007'
  - '@oxlint-tsgolint/win32-x64@7.0.2007'
  - oxlint-tsgolint@7.0.2007
# rolldown 跟随 tsdown/unrun 构建链路升级到 1.2.x 最新（vite 8 仍用 ~1.1.5，不覆盖）
overrides:
  'tsdown>rolldown': ^1.2.6
  'unrun>rolldown': ^1.2.6
  # cmdk 等 React 18 时代包的 peer 会把 @types/react@18 单独解析出一份，
  # 导致同一仓库出现两套 ReactNode 类型（ai-elements 里传 children 直接报类型不兼容）。
  # 统一提升到 19，与根 devDependencies 的 @types/react 对齐。
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  # jsdom 31 的 parse5-parser-stream@8.1.0 调用了 parse5 8.1 新增的
  # tokenizer.flushCharacters，但 pnpm 会解析到 8.0.1，jsdom 初始化直接
  # TypeError；把 8.x 统一到 8.1.0。parse5 7.x（hast-util）不受影响。
  'parse5@>=8.0.0 <9.0.0-0': 8.1.0
  # @streamdown/cjk 的 CjkPlugin.remarkPlugins 类型来自 unified 11.0.0，
  # streamdown 的 PluginConfig 用 11.0.5，两份 Pluggable 类型不兼容；
  # 把 11.x 统一到 11.0.5。
  'unified@>=11.0.0 <12.0.0-0': 11.0.5
permissions:
  '@tanstack/react-table':
    skills: true
  tsdown:
    skills: true
