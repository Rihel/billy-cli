packages:
  - 'packages/*'
  - 'apps/*'
allowBuilds:
  bcrypt: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@rolldown/binding-android-arm-eabi@1.2.6'
  - '@rolldown/binding-android-arm64@1.2.6'
  - '@rolldown/binding-darwin-arm64@1.2.6'
  - '@rolldown/binding-darwin-x64@1.2.6'
  - '@rolldown/binding-freebsd-x64@1.2.6'
  - '@rolldown/binding-linux-arm-gnueabihf@1.2.6'
  - '@rolldown/binding-linux-arm64-gnu@1.2.6'
  - '@rolldown/binding-linux-arm64-musl@1.2.6'
  - '@rolldown/binding-linux-ppc64-gnu@1.2.6'
  - '@rolldown/binding-linux-s390x-gnu@1.2.6'
  - '@rolldown/binding-linux-x64-gnu@1.2.6'
  - '@rolldown/binding-linux-x64-musl@1.2.6'
  - '@rolldown/binding-openharmony-arm64@1.2.6'
  - '@rolldown/binding-win32-arm64-msvc@1.2.6'
  - '@rolldown/binding-win32-x64-msvc@1.2.6'
  - rolldown@1.2.6
  - '@next/env@16.3.5'
  - '@next/swc-darwin-arm64@16.3.5'
  - '@next/swc-darwin-x64@16.3.5'
  - '@next/swc-linux-arm64-gnu@16.3.5'
  - '@next/swc-linux-arm64-musl@16.3.5'
  - '@next/swc-linux-x64-gnu@16.3.5'
  - '@next/swc-linux-x64-musl@16.3.5'
  - '@next/swc-win32-arm64-msvc@16.3.5'
  - '@next/swc-win32-x64-msvc@16.3.5'
  - next@16.3.5
# rolldown 跟随 tsdown/unrun 构建链路升级到 1.2.x 最新（vite 8 仍用 ~1.1.5，不覆盖）
overrides:
  'tsdown>rolldown': ^1.2.6
  'unrun>rolldown': ^1.2.6
