<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>billy hero — signal fabric</title>
<style>
  @font-face { font-family: "Geist Mono"; src: url("fonts/geist-mono.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Space Grotesk"; src: url("fonts/space-grotesk.woff2") format("woff2"); font-weight: 300 700; }
  html, body { margin: 0; height: 100%; background: #f0f2f7; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ========== Billy Cli 首屏背景：Signal Fabric ==========
   一张会呼吸的信号网。60 秒一次涨落，首尾同帧。
   所有随时间变化的量都用能整除 60 的周期（15 / 20 / 30 / 60），
   注释有明确的进场/退场窗口，60 秒时全部回到不可见 —— 循环处不会闪。 */
const W = 1920, H = 1080;
const DURATION = 60;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

const INK = [13, 15, 21];
const BRAND = [96, 87, 231];
const GRID = 64;   // 视频按 0.75 缩放到首屏时约 48px，接近站点原来的 56px 网格
const TAU = Math.PI * 2;

const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(3)})`;
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const smooth = (v) => { const x = clamp01(v); return x * x * (3 - 2 * x); };

function rnd(seed) {
  const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453123;
  return x - Math.floor(x);
}

/* ---- 节点与边：只在右侧织网，左侧留给标题 ---- */
const NODES = [];
const COLS = 30, ROWS = 17;
for (let r = 0; r < ROWS; r++) {
  for (let c = 0; c < COLS; c++) {
    const x = c * GRID + 8, y = r * GRID + 8;
    if (x < W * 0.32) continue;
    NODES.push({ id: r * COLS + c, x, y, r, c });
  }
}
const byId = new Map(NODES.map((n) => [n.id, n]));
const EDGES = [];
for (const n of NODES) {
  const right = byId.get(n.id + 1);
  const down = byId.get(n.id + COLS);
  if (right && right.r === n.r) EDGES.push({ a: n, b: right });
  if (down) EDGES.push({ a: n, b: down });
}

/* ---- 脉冲：周期 15 / 20 / 30 秒，能整除 60 ---- */
const PULSES = [];
for (let i = 0; i < 30; i++) {
  const e = EDGES[Math.floor(rnd(i * 3.7 + 1) * EDGES.length)];
  const periods = [15, 20, 30];
  PULSES.push({
    e,
    offset: rnd(i * 9.1 + 2),
    period: periods[Math.floor(rnd(i * 4.3) * 3)],
    speedHint: rnd(i * 5.9),
  });
}

/* ---- 注释：四条，时间窗明确，60 秒时全部关闭 ---- */
const ANNOTATIONS = [
  { x: 0.72, y: 0.26, text: 'apps/web', sub: 'Next.js 16', in: 4, out: 13 },
  { x: 0.86, y: 0.34, text: 'apps/admin', sub: 'design tokens', in: 9, out: 19 },
  { x: 0.74, y: 0.45, text: 'apps/server', sub: 'NestJS 12', in: 13, out: 24 },
  { x: 0.88, y: 0.55, text: 'packages/*', sub: 'ui · sdk · shared', in: 19, out: 31 },
  { x: 0.73, y: 0.64, text: 'pnpm bootstrap', sub: '1 command', in: 24, out: 37 },
  { x: 0.88, y: 0.73, text: 'agent skills', sub: '17', in: 29, out: 45 },
];

/** 每条注释的锚点 = 标签左侧最近的节点，避免长引线横穿整张网 */
for (const a of ANNOTATIONS) {
  const ax = a.x * W, ay = a.y * H;
  let best = null, bestD = Infinity;
  for (const n of NODES) {
    const d = Math.hypot(n.x - (ax - 70), n.y - (ay - 6));
    if (d < bestD) { bestD = d; best = n; }
  }
  a.node = best;
}

/* ---- 涟漪：每 10 秒从某个节点扩散一圈 ---- */
const RIPPLES = [10, 20, 30, 40, 50].map((start, i) => {
  const node = NODES[Math.floor(rnd(i * 13.3 + 5) * NODES.length)];
  return { start, node };
});

function annotationAlpha(a, t) {
  const inK = smooth((t - a.in) / 2.2);
  const outK = 1 - smooth((t - a.out) / 2.2);
  return Math.min(inK, outK);
}

function waveAt(x, y, t) {
  // 主波：60 秒走完一整程；副波反向、半幅
  const u = (x * 0.62 + y * 0.78) / 1700;
  const v = (x * -0.74 + y * 0.67) / 2100;
  const main = 0.5 + 0.5 * Math.sin(u * 3.2 - TAU * (t / DURATION));
  const back = 0.5 + 0.5 * Math.sin(v * 2.1 + TAU * (t / DURATION) * 2);
  return 0.62 * main + 0.38 * back;
}

/* ---- 强度包络：0s 静 → 30s 密 → 60s 回到 0 ---- */
function envelope(t) {
  return 0.35 + 0.65 * (0.5 - 0.5 * Math.cos(TAU * (t / DURATION)));
}

window.render = function (rawT) {
  const t = ((rawT % DURATION) + DURATION) % DURATION;
  const env = envelope(t);
  const breath = 1 + 0.014 * Math.sin(TAU * (t / 30));
  const drift = 16 * Math.sin(TAU * (t / DURATION));

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#f0f2f7';
  ctx.fillRect(0, 0, W, H);

  // 底网格
  ctx.strokeStyle = rgba(INK, 0.028);
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += GRID) { ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += GRID) { ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); ctx.stroke(); }

  ctx.save();
  ctx.translate(W * 0.66 + drift, H * 0.5);
  ctx.scale(breath, breath);
  ctx.translate(-W * 0.66, -H * 0.5);

  // 边：亮度跟着行波走
  ctx.lineWidth = 1;
  for (const e of EDGES) {
    const k = 1 - Math.min(1, Math.abs(e.a.x - W * 0.66) / (W * 0.5));
    const wv = 0.3 + 0.7 * waveAt(e.a.x, e.a.y, t);
    const alpha = (0.05 + 0.14 * k) * wv * (0.75 + 0.25 * env);
    ctx.strokeStyle = rgba(INK, alpha);
    ctx.beginPath(); ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y); ctx.stroke();
  }

  // 节点：呼吸 + 行波
  for (const n of NODES) {
    const dist = Math.hypot(n.x - W * 0.66, n.y - H * 0.5);
    const k = Math.max(0, 1 - dist / (W * 0.62));
    const pulse = 0.5 + 0.5 * Math.sin(TAU * (t / 15) + n.id * 0.37);
    const wv = waveAt(n.x, n.y, t);
    const alpha = (0.055 + 0.17 * k) * (0.3 + 0.95 * wv) + 0.07 * pulse * k * env;
    ctx.fillStyle = rgba(INK, alpha);
    ctx.beginPath();
    ctx.arc(n.x, n.y, 1.5 + 1.6 * k * wv, 0, TAU);
    ctx.fill();
  }

  // 脉冲
  for (const p of PULSES) {
    const local = ((t / p.period) + p.offset) % 1;
    const span = 0.5;
    if (local > span) continue;
    const k = local / span;
    const ease = k * k * (3 - 2 * k);
    const x = p.e.a.x + (p.e.b.x - p.e.a.x) * ease;
    const y = p.e.a.y + (p.e.b.y - p.e.a.y) * ease;
    const edgeK = 1 - Math.min(1, Math.abs(p.e.a.x - W * 0.66) / (W * 0.55));
    const alpha = (0.22 + 0.55 * edgeK) * Math.sin(Math.PI * k) * (0.45 + 0.55 * env);
    if (alpha < 0.01) continue;

    // 尾迹
    const tail = Math.max(0, ease - 0.14);
    ctx.strokeStyle = rgba(BRAND, alpha * 0.45);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.e.a.x + (p.e.b.x - p.e.a.x) * tail, p.e.a.y + (p.e.b.y - p.e.a.y) * tail);
    ctx.lineTo(x, y);
    ctx.stroke();
    // 头
    ctx.fillStyle = rgba(BRAND, Math.min(0.9, alpha * 1.3));
    ctx.beginPath(); ctx.arc(x, y, 3.1, 0, TAU); ctx.fill();
  }

  // 涟漪
  for (const rp of RIPPLES) {
    const life = (t - rp.start) / 3.4;
    if (life <= 0 || life >= 1) continue;
    const radius = 24 + 260 * smooth(life);
    const alpha = (1 - life) * 0.2;
    ctx.strokeStyle = rgba(BRAND, alpha);
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(rp.node.x, rp.node.y, radius, 0, TAU); ctx.stroke();
    ctx.fillStyle = rgba(BRAND, alpha * 1.6);
    ctx.beginPath(); ctx.arc(rp.node.x, rp.node.y, 3.2, 0, TAU); ctx.fill();
  }

  // 注释（带引导线与锚点）
  for (let i = 0; i < ANNOTATIONS.length; i++) {
    const a = ANNOTATIONS[i];
    const alpha = annotationAlpha(a, t);
    if (alpha <= 0.01) continue;
    const x = a.x * W, y = a.y * H;
    const node = a.node;

    // 锚点：加一圈缓慢扩散的环
    const ringPhase = ((t / 6) + i * 0.25) % 1;
    ctx.strokeStyle = rgba(BRAND, alpha * 0.22 * (1 - ringPhase));
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(node.x, node.y, 6 + 26 * ringPhase, 0, TAU); ctx.stroke();
    ctx.fillStyle = rgba(BRAND, alpha * 0.75);
    ctx.beginPath(); ctx.arc(node.x, node.y, 2.6, 0, TAU); ctx.fill();

    // 引线：锚点 → 标签
    ctx.strokeStyle = rgba(BRAND, alpha * 0.3);
    ctx.beginPath();
    ctx.moveTo(node.x + 4, node.y);
    ctx.lineTo(x - 26, node.y);
    ctx.lineTo(x - 10, y - 6);
    ctx.stroke();

    // 标签
    ctx.globalAlpha = alpha * 0.85;
    ctx.textAlign = 'left';
    ctx.font = '500 20px "Geist Mono", monospace';
    ctx.fillStyle = rgba(INK, 0.92);
    ctx.fillText(a.text, x, y);
    ctx.font = '400 14px "Geist Mono", monospace';
    ctx.fillStyle = rgba(INK, 0.55);
    ctx.fillText(a.sub, x, y + 22);
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  // 角标：极淡的工程图签，0–60s 都在，不参与循环
  ctx.textAlign = 'left';
  ctx.font = '500 11px "Geist Mono", monospace';
  ctx.fillStyle = rgba(INK, 0.22);
  ctx.fillText('SIGNAL FABRIC — BILLY CLI', 64, H - 48);
  ctx.fillStyle = rgba(INK, 0.14);
  ctx.fillText('17 SKILLS · 2 APPS · 1 TEMPLATE', 64, H - 30);
};

window.ready = false;
document.fonts.ready.then(() => { window.render(0); window.ready = true; });
</script>
</body>
</html>
