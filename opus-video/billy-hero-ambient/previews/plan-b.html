<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>plan-b blueprint</title>
<style>
  @font-face { font-family: "Geist Mono"; src: url("fonts/geist-mono.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Space Grotesk"; src: url("fonts/space-grotesk.woff2") format("woff2"); font-weight: 300 700; }
  html, body { margin: 0; height: 100%; background: #f0f2f7; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ========== 方案 B 预览：Monorepo 剖面（轴测蓝图） ==========
   把仓库画成一张工程轴测图：四层楼板（apps/web+admin、apps/server、packages、数据层），
   细虚线、尺寸标注、mono 标签；相机极慢环绕 ±4°，右侧为主，左侧留白。 */
const W = 1920, H = 1080;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

const INK = [13, 15, 21];
const BRAND = [96, 87, 231];
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

// 轴测投影（单位：世界坐标）
const COS = Math.cos(Math.PI / 6), SIN = Math.sin(Math.PI / 6);
function project(x, y, z, cam) {
  // cam: {rot, zoom, ox, oy}
  const rx = x * Math.cos(cam.rot) - y * Math.sin(cam.rot);
  const ry = x * Math.sin(cam.rot) + y * Math.cos(cam.rot);
  return {
    sx: cam.ox + (rx - ry) * COS * cam.zoom,
    sy: cam.oy + (rx + ry) * SIN * cam.zoom - z * cam.zoom,
  };
}

// 四层楼板：z 高度、尺寸、名称、子项
const PLATES = [
  { z: 0,   w: 470, h: 330, label: 'data layer', items: ['PostgreSQL', 'Redis', 'S3 / COS'], tint: 0.02 },
  { z: 210, w: 430, h: 300, label: 'packages/*', items: ['ui', 'sdk', 'shared', 'kits'], tint: 0.03 },
  { z: 420, w: 390, h: 275, label: 'apps/server', items: ['NestJS 12', 'AI agent', 'monitor engine'], tint: 0.045 },
  { z: 630, w: 350, h: 250, label: 'apps/web · apps/admin', items: ['Next.js 16', 'design tokens'], tint: 0.06 },
];

function platePath(cam, p) {
  const hw = p.w / 2, hh = p.h / 2;
  const pts = [
    [-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh],
  ].map(([x, y]) => project(x, y, p.z, cam));
  return pts;
}

function drawPlate(cam, p, t) {
  const top = platePath(cam, p);
  const bottom = platePath(cam, { ...p, z: p.z - 26 });
  const depth = Math.max(8, 26 * cam.zoom);

  // 侧面（南、东两面）
  ctx.beginPath();
  ctx.moveTo(top[3].sx, top[3].sy);
  ctx.lineTo(top[2].sx, top[2].sy);
  ctx.lineTo(bottom[2].sx, bottom[2].sy);
  ctx.lineTo(bottom[3].sx, bottom[3].sy);
  ctx.closePath();
  ctx.fillStyle = rgba(INK, p.tint * 2.2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(top[1].sx, top[1].sy);
  ctx.lineTo(top[2].sx, top[2].sy);
  ctx.lineTo(bottom[2].sx, bottom[2].sy);
  ctx.lineTo(bottom[1].sx, bottom[1].sy);
  ctx.closePath();
  ctx.fillStyle = rgba(INK, p.tint * 3.2);
  ctx.fill();

  // 顶面
  ctx.beginPath();
  top.forEach((pt, i) => (i ? ctx.lineTo(pt.sx, pt.sy) : ctx.moveTo(pt.sx, pt.sy)));
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.72)';
  ctx.fill();
  ctx.strokeStyle = rgba(BRAND, 0.42);
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // 楼板上的网格（每 40 单位一条，极淡）
  ctx.strokeStyle = rgba(INK, 0.06);
  ctx.lineWidth = 0.6;
  for (let gx = -p.w / 2; gx <= p.w / 2; gx += 40) {
    const a = project(gx, -p.h / 2, p.z, cam), b = project(gx, p.h / 2, p.z, cam);
    ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
  }
  for (let gy = -p.h / 2; gy <= p.h / 2; gy += 40) {
    const a = project(-p.w / 2, gy, p.z, cam), b = project(p.w / 2, gy, p.z, cam);
    ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
  }

  // 层标签（挂在楼板左前角）
  const labelAt = project(-p.w / 2, p.h / 2, p.z, cam);
  // 引线
  ctx.strokeStyle = rgba(BRAND, 0.28);
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(labelAt.sx - 26, labelAt.sy + 18); ctx.lineTo(labelAt.sx - 6, labelAt.sy + 18); ctx.stroke();
  ctx.beginPath(); ctx.arc(labelAt.sx - 4, labelAt.sy + 18, 2, 0, Math.PI * 2); ctx.fillStyle = rgba(BRAND, 0.6); ctx.fill();

  ctx.textAlign = 'right';
  ctx.font = '500 18px "Geist Mono", monospace';
  ctx.fillStyle = rgba(INK, 0.74);
  ctx.fillText(p.label, labelAt.sx - 34, labelAt.sy + 24);

  // 子项（一行 mono，小字）
  ctx.font = '400 12px "Geist Mono", monospace';
  ctx.fillStyle = rgba(INK, 0.38);
  ctx.fillText(p.items.join('  ·  '), labelAt.sx - 34, labelAt.sy + 42);
}

window.render = function (t) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#f0f2f7';
  ctx.fillRect(0, 0, W, H);

  // 蓝图底网格
  ctx.strokeStyle = rgba(INK, 0.028);
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 48) { ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 48) { ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); ctx.stroke(); }

  const cam = {
    rot: -0.22 + 0.055 * Math.sin(t * 0.10),   // 极慢环绕
    zoom: 0.70 + 0.015 * Math.sin(t * 0.07),
    ox: W * 0.70 + 14 * Math.sin(t * 0.06),
    oy: H * 0.82 + 8 * Math.sin(t * 0.09),
  };

  // 楼板按 z 从低到高画（远的先画）
  for (const p of PLATES) drawPlate(cam, p, t);

  // 层间数据流：竖直连线 + 上行的光点
  const pairs = [[0, 1], [1, 2], [2, 3]];
  for (const [i, j] of pairs) {
    const a = PLATES[i], b = PLATES[j];
    for (let dx = -1; dx <= 1; dx += 2) {
      const x = dx * a.w * 0.32;
      const pA = project(x, a.h * 0.3, a.z, cam);
      const pB = project(x, b.h * 0.3, b.z - 26, cam);
      ctx.strokeStyle = rgba(BRAND, 0.18);
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(pA.sx, pA.sy); ctx.lineTo(pB.sx, pB.sy); ctx.stroke();

      // 光点：每层各一颗，周期 6 秒
      const k = ((t / 6) + i * 0.33 + (dx > 0 ? 0.5 : 0)) % 1;
      const sx = pA.sx + (pB.sx - pA.sx) * k;
      const sy = pA.sy + (pB.sy - pA.sy) * k;
      const fade = Math.sin(Math.PI * k);
      ctx.fillStyle = rgba(BRAND, 0.55 * fade);
      ctx.beginPath(); ctx.arc(sx, sy, 3, 0, Math.PI * 2); ctx.fill();
    }
  }

  // 左上角图签
  ctx.textAlign = 'left';
  ctx.font = '500 12px "Geist Mono", monospace';
  ctx.fillStyle = rgba(INK, 0.34);
  ctx.fillText('FIG. 01 — STACK SECTION', 64, 72);
  ctx.fillStyle = rgba(INK, 0.22);
  ctx.fillText('SCALE 1 : 1  ·  PACKAGES 5  ·  APPS 3', 64, 92);
};

window.ready = false;
document.fonts.ready.then(() => { window.render(2); window.ready = true; });
</script>
</body>
</html>
