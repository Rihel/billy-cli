apiVersion: v1
kind: Service
metadata:
  name: billy-common-capability
  namespace: billy
  labels:
    app.kubernetes.io/name: billy-common-capability
    app.kubernetes.io/component: common-capability
spec:
  # 内部服务：主要用于运维直连探针 / 排障（探 /healthz、/readyz、手工调用 /invoke）。
  # 正常调用路径是 capability-gateway 从 Redis 注册表按负载选中实例，再直连该实例上报的
  # Pod IP（TOOL_WORKER_ENDPOINT，见 24-deployment-common-capability.yaml），不经过本 Service。
  #
  # ⚠️ 当前固定 1 副本，不要把它当作可负载均衡的执行入口：本地回落工作区 / 进程内任务句柄
  # 不跨 Pod 共享（原因见 24-deployment-common-capability.yaml 顶部注释）。
  type: ClusterIP
  selector:
    app.kubernetes.io/name: billy-common-capability
  ports:
    - name: http
      port: 9994
      targetPort: http # 对应容器端口名 http(9994)
      protocol: TCP
      appProtocol: http
  sessionAffinity: None
