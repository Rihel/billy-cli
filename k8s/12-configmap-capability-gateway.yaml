# capability-gateway 的非敏感运行配置（内部服务，容器端口 9993）。
#
# 敏感项全在 Secret `billy-app`：DB_URL（写审计）/ REDIS_URL（能力注册表）/ TOOL_INTERNAL_TOKEN。
# Deployment 的 envFrom 顺序：billy-shared → billy-capability-gateway → billy-app（键不重复）。
#
# ⚠️ `TOOL_INTERNAL_TOKEN` 必须与 common-capability、以及调用方（agent-runtime、billy-main、
# 以及登记时携带它的 workspace-service）完全一致，否则登记 / 调用一律 403。用共享 Secret `billy-app` 保证。
apiVersion: v1
kind: ConfigMap
metadata:
  name: billy-capability-gateway
  namespace: billy
  labels:
    app.kubernetes.io/name: billy-capability-gateway
    app.kubernetes.io/component: capability-gateway
data:
  # 容器监听端口；Service 的 targetPort 按它
  PORT: '9993'
  # 注册表 freshness：超过这个时间没心跳的实例不参与选路（gateway 侧单方配置）。
  # 选路只走 Redis 注册表 → 直连实例上报的 endpoint（common-capability 用 Pod IP，见 24 号文件）。
  TOOL_WORKER_STALE_MS: '30000'
  # 单次调用安全上限；请求里的 deadlineMs 更小则听请求的（workspace 的 bash 默认 5 分钟 + 传输余量）
  TOOL_GATEWAY_TIMEOUT_MS: '310000'
  # 单用户 + 单工具每分钟上限（gateway 自己的限流，不是 facade 的 run 准入）
  TOOL_GATEWAY_RATE_LIMIT_PER_MINUTE: '60'
