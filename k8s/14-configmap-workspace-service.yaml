# workspace-service 的非敏感运行配置（内部执行面，端口 9995）。
#
# 它是工作区执行面：按 `ai_workspaces` 的配置起工作区容器 / Pod，执行 bash + 7 个工作区文件能力
# （file-list / read-file / write-file / append-file / replace-file / file-search / workspace-files），
# 启动时向能力网关登记服务 `workspace`。
#
# 敏感项在 Secret `billy-app`：DB_URL / WORKSPACE_INTERNAL_TOKEN，以及向能力网关登记时携带的
# TOOL_INTERNAL_TOKEN。Deployment 的 envFrom 顺序：billy-shared → billy-workspace-service → billy-app。
apiVersion: v1
kind: ConfigMap
metadata:
  name: billy-workspace-service
  namespace: billy
  labels:
    app.kubernetes.io/name: billy-workspace-service
    app.kubernetes.io/component: workspace-service
data:
  PORT: '9995'
  WORKSPACE_SERVICE_PORT: '9995'
  # 控制面地址：凭据解析 / 凭据入库都调它。走 main 的 Service 端口 80（容器内 9989 由 targetPort 映射）；
  # 不配会回落到 127.0.0.1:9989，Pod 里必然连不上 —— 启动自检会直接拒绝启动。
  MAIN_URL: http://billy-main.billy.svc.cluster.local:80
  # 能力网关：**登记地址**（启动时向它登记 `workspace` 的 bash / 文件能力并续心跳）。
  # 不配会跳过登记（只打一条 warn）→ 后台能力目录里没有 workspace，bash / 文件调用 no-provider。
  WORKSPACE_GATEWAY_URL: http://billy-capability-gateway.billy.svc.cluster.local:9993
  # 多副本：跨副本锁 / lastUsed 走 Redis；启动自检会拒绝 docker / local 后端。
  WORKSPACE_MULTI_INSTANCE: 'true'
  # 登记地址不在这里配：每个 Pod 的 instanceId / endpoint 由 Deployment 的 downward API
  # 注入（POD_NAME / POD_IP），不能用 Service DNS（否则网关 / tasks/get 会回错 Pod）。
  # 云端多租户：必须用 kubernetes（docker 后端要挂 docker.sock，等于把宿主 daemon 交出去）
  WORKSPACE_CONTAINER_RUNTIME: 'kubernetes'
  WORKSPACE_K8S_NAMESPACE: 'billy'
  # 工作区容器镜像；**必须与镜像 tag 同步**，且必须能被集群拉取（节点要能访问该 registry）。
  # workspace-service 创建的工作区 Pod 不设置 imagePullSecrets，私有仓库需要节点级凭据。
  WORKSPACE_DEFAULT_IMAGE: 'billy-workspace:2026.11.1'
  # local 后端（仅自托管 / 本地联调）的根；kubernetes 后端不用它
  WORKSPACE_LOCAL_ROOT: '/home/appuser/.billy/workspaces'
  # 2 小时空闲回收
  WORKSPACE_IDLE_TIMEOUT_MS: '7200000'
  WORKSPACE_REAP_INTERVAL_MS: '60000'
  LOG_PREFIX: 'workspace-service'
  # local 后端没有 OS 沙箱时用 off 仅联调；kubernetes 后端的工作区是容器 / Pod，隔离靠容器边界，
  # 本键对 kubernetes 后端不生效，保持默认 enforce。
  # 是否启用命令隔离（旧键 AGENT_WORKSPACE_MODE=enforce 等价）
  AGENT_WORKSPACE_SANDBOX: 'true'
