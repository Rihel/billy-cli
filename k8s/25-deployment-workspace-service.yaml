apiVersion: apps/v1
kind: Deployment
metadata:
  name: billy-workspace-service
  namespace: billy
  labels:
    app.kubernetes.io/name: billy-workspace-service
    app.kubernetes.io/component: workspace-service
spec:
  # 多副本（Batch 2）：运行态仍不落 DB，但跨副本的 lifecycle / exec / fs 锁与 lastUsed
  # 都放 Redis；任意副本都能处理任意工作区（kubernetes 后端下都能 kubectl exec 工作区 Pod）。
  # Docker / local 后端仍只允许单副本（启动自检会拒绝）。
  #
  # 本 Deployment **不挂业务 PVC**：kubernetes 后端下工作区就是一个带 `app=billy-workspace`
  # 标签的 Pod（`/workspace` 用 emptyDir），由本服务通过 ServiceAccount / Role 创建、exec、删除
  # （见 16-rbac-workspace-service.yaml）。工作区里的未提交文件随 Pod 回收丢失，文件真相在对象存储。
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 2 副本下滚动更新保持至少 1 个可用；多副本锁已能防新旧 Pod 双写同一工作区
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: billy-workspace-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billy-workspace-service
        app.kubernetes.io/component: workspace-service
    spec:
      # 创建 / exec / 删除工作区 Pod 需要这个 SA 的 RBAC（16 号文件）；漏配则 kubectl 403
      serviceAccountName: billy-workspace-service
      terminationGracePeriodSeconds: 60
      containers:
        - name: workspace-service
          # ← 替换为你的镜像地址与 tag（当前是无 registry 前缀的占位值）
          image: billy-workspace-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9995
          # 共享配置（NODE_ENV / 日志 / 对象存储，实际只读 NODE_ENV / LOG_LEVEL）→ 专属配置 → 共享 Secret
          #（DB_URL / WORKSPACE_INTERNAL_TOKEN / 向能力网关登记用的 TOOL_INTERNAL_TOKEN）
          envFrom:
            - configMapRef:
                name: billy-shared
            - configMapRef:
                name: billy-workspace-service
            - secretRef:
                name: billy-app
          env:
            # 每个 Pod 必须上报自己的地址：网关按 instance 回调 /invoke，tasks/get 也按实例回查；
            # 用 Service DNS 会落到随机 Pod，任务查询会 expired。
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: WORKSPACE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WORKSPACE_SERVICE_ENDPOINT
              value: http://$(POD_IP):9995
          # 多副本时 /readyz 会 ping Redis；Redis 不可用则摘流（锁依赖不可用不能继续执行）。
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ['ALL']
