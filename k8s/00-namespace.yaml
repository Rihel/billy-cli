# Billy 服务端 Kubernetes 部署清单
#
# 本目录覆盖两个服务：
# - billy-main（apps/main，9989）：公网唯一入口，Deployment / Service / Ingress / PDB；
# - billy-agent-runtime（apps/agent-runtime，9990）：内部 ClusterIP，不接公网 Ingress。
# web / admin 的部署另议。
# 全部占位符需替换：镜像地址与 tag、域名 api.example.com、DB / Redis 地址与凭据。
# 字段取值的来由（尤其「滚动更新为什么不 502」）见同目录 README.md。
apiVersion: v1
kind: Namespace
metadata:
  name: billy
  labels:
    app.kubernetes.io/part-of: billy-cli
