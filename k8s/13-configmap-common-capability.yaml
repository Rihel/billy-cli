# common-capability 的非敏感运行配置（内部服务，容器端口 9994）。
#
# 它是能力执行服务 `common`：9 个能力（file-submit / file-download、web-*、memory-*、
# read-tool-result），不跑 bash（bash 由 workspace-service 执行）。启动时向能力网关登记，
# 之后只发心跳。
#
# 敏感项全在 Secret `billy-app`：DB_URL / REDIS_URL / TOOL_INTERNAL_TOKEN / WORKSPACE_INTERNAL_TOKEN /
# 对象存储密钥；对象存储的 provider / region / bucket / endpoint 在 `billy-shared`。
# Deployment 的 envFrom 顺序：billy-shared → billy-common-capability → billy-app（键不重复）。
#
# 注意：本 Deployment 还用 downward API 注入 POD_NAME / POD_IP，并在容器的 env 里派生出
# TOOL_WORKER_ID / TOOL_WORKER_ENDPOINT（每个 Pod 注册自己的 Pod IP，不走 Service 轮询）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: billy-common-capability
  namespace: billy
  labels:
    app.kubernetes.io/name: billy-common-capability
    app.kubernetes.io/component: common-capability
data:
  # 容器监听端口；Service 的 targetPort 按它
  PORT: '9994'
  # 能力网关：**登记地址**（启动时向它登记 `common` 的 9 个能力并续心跳）。
  # 不配会跳过登记（只打一条 warn）→ 后台能力目录里没有 common，调用返回 no-provider。
  CAPABILITY_GATEWAY_URL: http://billy-capability-gateway.billy.svc.cluster.local:9993
  # workspace-service：file-submit / file-download 的 WorkspaceFsPort 走它（读写工作区文件）。
  # 不配时回落 http://127.0.0.1:9995，Pod 里必然调不到。
  WORKSPACE_SERVICE_URL: http://billy-workspace-service.billy.svc.cluster.local:9995
  # 本地回落根：仅当会话还没有绑定工作区（没有 workspaceId）时，文件读写才落到本 Pod 本地盘；
  # 正常路径（会话已绑定工作区）的文件 / 命令执行都在 workspace-service 的容器里，不用这个根。
  TOOL_WORKER_WORKSPACE_ROOT: /home/appuser/.billy-cli
  # 单 Pod 同时执行上限：与内存 limit 一起看，别让 8 条并发的大结果 / web 拉取把 1Gi 的 Pod 打 OOM
  TOOL_WORKER_MAX_CONCURRENCY: '8'
  # 心跳间隔（gateway 侧按自己的 TOOL_WORKER_STALE_MS 判过期）
  TOOL_WORKER_HEARTBEAT_MS: '10000'
