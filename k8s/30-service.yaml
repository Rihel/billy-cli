apiVersion: v1
kind: Service
metadata:
  name: billy-main
  namespace: billy
  labels:
    app.kubernetes.io/name: billy-main
    app.kubernetes.io/component: main
spec:
  # 公网入口：只通过 Ingress 暴露，Service 本身仍是 ClusterIP
  type: ClusterIP
  selector:
    app.kubernetes.io/name: billy-main
  ports:
    - name: http
      port: 80
      targetPort: http # 对应容器端口名 http(9989)
      protocol: TCP
      appProtocol: http
  # SSE 长连接**不需要**会话保持：事件经 Redis pub/sub 按 `agent:stream:client:<clientId>`
  # 定向投递到持有该连接的 main 实例，客户端重连落到哪个 Pod 都能重新绑定
  #（这也就让滚动更新时客户端重连不挑实例）
  sessionAffinity: None
