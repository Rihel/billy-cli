# model-gateway 的非敏感运行配置（内部服务，容器端口 9992）。
#
# 敏感项全在 Secret `billy-app`：DB_URL / REDIS_URL / MODEL_INTERNAL_TOKEN。
# Deployment 的 envFrom 顺序：billy-shared → billy-model-gateway → billy-app（键不重复）。
#
# ⚠️ `MODEL_INTERNAL_TOKEN` 是 model-gateway **自己**读的变量名；
# agent-runtime / billy-main 侧读的是 `MODEL_GATEWAY_TOKEN`。两者必须同值，否则调用一律 401。
apiVersion: v1
kind: ConfigMap
metadata:
  name: billy-model-gateway
  namespace: billy
  labels:
    app.kubernetes.io/name: billy-model-gateway
    app.kubernetes.io/component: model-gateway
data:
  # 容器监听端口；Service 的 targetPort 与 runtime 的 MODEL_GATEWAY_URL 都按它
  PORT: '9992'
  # 模型目录缓存时长：配置变更靠事件 + TTL 兜底
  MODEL_GATEWAY_CACHE_TTL_MS: '30000'
  # 上游首字节超时：长推理模型可能很慢，别按普通 HTTP 的 30s 设
  MODEL_GATEWAY_FIRST_BYTE_TIMEOUT_MS: '120000'
  # 流中空闲超时：超过这段时间没有新块就 abort 上游，避免挂死的流占满连接
  MODEL_GATEWAY_IDLE_TIMEOUT_MS: '180000'
  # HPA 最多 8 副本：连接池 × 副本数必须留在 PostgreSQL max_connections 内（8 × 5 = 40），
  # 不要沿用默认的 10（8 × 10 = 80，会和 main / runtime / worker 抢连接）
  DB_POOL_SIZE: '5'
