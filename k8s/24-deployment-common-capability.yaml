apiVersion: apps/v1
kind: Deployment
metadata:
  name: billy-common-capability
  namespace: billy
  labels:
    app.kubernetes.io/name: billy-common-capability
    app.kubernetes.io/component: common-capability
spec:
  # ⚠️ 默认 1 副本（当前清单口径），不加 HPA：
  # - 能力登记是「一个进程登记一个服务 common + 9 个能力」；实例的 task 句柄 / 在跑计数只在进程内
  #   （TaskManager / ActiveTaskCounter），不共享；
  # - 会话尚未绑定 workspaceId 的旧数据，文件读写会回落本 Pod 本地盘（TOOL_WORKER_WORKSPACE_ROOT），
  #   多副本会落到不同 Pod、彼此看不到；
  # - 正常路径（会话已绑工作区）的 bash / 文件执行都在 workspace-service 的容器里，本服务不跑命令。
  # 要横向扩：先确认本地回落路径不再被使用（或给它挂共享 RWX 卷），再把副本数 / HPA 提上去。
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 单副本时 maxUnavailable=0 + maxSurge=1 是唯一不中断的选择：
      # 新 Pod 就绪并注册到 Redis 之后，旧 Pod 才被摘掉。
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: billy-common-capability
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billy-common-capability
        app.kubernetes.io/component: common-capability
    spec:
      # 单次调用最长 310s（capability-gateway 的 TOOL_GATEWAY_TIMEOUT_MS），但本服务的能力都是
      # sync 形态、单次几十秒内结束；60s 足够让在跑的调用结束、实例从注册表摘除。
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: billy-common-capability
      containers:
        - name: common-capability
          # ← 替换为你的镜像地址与 tag
          image: registry.example.com/billy-cli/common-capability:v0.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9994
              protocol: TCP
          envFrom:
            # 共享配置（NODE_ENV / 日志 / 对象存储 provider·bucket·endpoint）
            # → worker 专属配置 → 共享 Secret（DB / Redis / 对象存储密钥 / TOOL_INTERNAL_TOKEN）
            - configMapRef:
                name: billy-shared
            - configMapRef:
                name: billy-common-capability
            - secretRef:
                name: billy-app
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # 注册表里的唯一 id：直接用 Pod 名，排障时能从 Redis / 日志反查到 Pod
            - name: TOOL_WORKER_ID
              value: $(POD_NAME)
            # 每个 Pod 注册**自己的 Pod IP**，而不是 Service DNS：
            # capability-gateway 按 active / maxConcurrency 选中实例后，直连该实例上报的 endpoint；
            # 若填 Service DNS，多副本时请求会被 kube-proxy 轮询到别的 Pod，实例选路 / 任务归属就失效了。
            - name: TOOL_WORKER_ENDPOINT
              value: http://$(POD_IP):9994
          lifecycle:
            preStop:
              exec:
                # 先等 Service endpoint 摘流，再让进程收到 SIGTERM。
                # 注意：gateway 正常路径走注册表里上报的实例地址、不经过 Service，
                # 真正的「摘流」是进程收 SIGTERM 后从注册表注销本实例；
                # 这 8s 只是给 kube-proxy / 观测面留收敛时间。
                command: ['/bin/sh', '-c', 'sleep 8']
          startupProbe:
            # 只探进程：/readyz 会探 DB + Redis，启动阶段依赖未就绪会误杀
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            # /readyz 会探 DB + Redis，任一不可用返回 503，探针语义是严格有效的
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            # 绝不探外部依赖：Redis 抖动时重启实例只会丢进程内任务句柄 / 本地回落文件，不能修好 Redis
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            # 本服务执行 web 拉取 / 记忆 / 文件（经 workspace-service），内存主要花在响应解析与大结果上；
            # limit 与 TOOL_WORKER_MAX_CONCURRENCY 一起看，别让并发把 1Gi 的 Pod 打 OOM。
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      securityContext:
        # Dockerfile 已 `USER appuser`（非 root），这里再做一次显式声明兜底
        runAsNonRoot: true
