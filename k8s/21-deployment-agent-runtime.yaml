apiVersion: apps/v1
kind: Deployment
metadata:
  name: billy-agent-runtime
  namespace: billy
  labels:
    app.kubernetes.io/name: billy-agent-runtime
    app.kubernetes.io/component: agent-runtime
spec:
  # 内部运行时：不接公网流量，2 副本即可覆盖滚动更新；真正防重依赖 AGENT_MULTI_INSTANCE + Redis 租约
  replicas: 2
  # 与 main 同一套滚动策略：先起新 Pod 并等就绪，再杀旧 Pod。
  # runtime 上可能有在跑的 agent run（SSE / Kafka 事件），滚动期间必须保留至少一份可用实例。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: billy-agent-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billy-agent-runtime
        app.kubernetes.io/component: agent-runtime
    spec:
      # 与 main 相同：SHUTDOWN_TIMEOUT_MS(25s) + preStop(8s) < 60s
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: billy-agent-runtime
      containers:
        - name: agent-runtime
          # ← 替换为你的镜像地址与 tag；tag 变了 ConfigMap 的 billy-agent-runtime.APP_VERSION 也要同步
          image: registry.example.com/billy-cli/agent-runtime:v0.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9990
              protocol: TCP
          envFrom:
            # 共享配置 → runtime 专属配置 → 共享 Secret（DB / Redis / JWT / AGENT_INTERNAL_TOKEN）
            - configMapRef:
                name: billy-shared
            - configMapRef:
                name: billy-agent-runtime
            - secretRef:
                name: billy-app
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # 会话工作区持久卷：bash / 文件工具共用 `{挂载点}/{conversationId}/`。
          # - 挂载点必须与 ConfigMap 的 AGENT_COMMAND_WORK_DIR 一致（不改时默认也是这个路径）；
          # - PVC 必须是 RWX：HPA 会把 runtime 扩到 8 个 Pod，RWO 下只有第一个能挂上；
          # - 卷根目录的属主 / 权限由存储类决定，写不进去时给 Pod 补 fsGroup（见 PVC 文件注释）。
          volumeMounts:
            - name: workspaces
              mountPath: /home/appuser/.billy/workspaces
          # 与 main 相同：先等 endpoint 摘流，再接收 SIGTERM，避免在途长请求被立刻切断
          lifecycle:
            preStop:
              exec:
                command: ['/bin/sh', '-c', 'sleep 8']
          # runtime 的 ops 模块同样提供 /healthz（liveness）与 /readyz（readiness），
          # 语义与 main 一致：liveness 不探外部依赖，readiness 探 DB / Redis。
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30 # 最长容忍 60s 启动
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            # agent 执行（模型流式 + 工具 + 工作区）比 main 重，给更宽的 CPU / 内存
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
      # 工作区卷：与 15-pvc-agent-runtime-workspaces.yaml 的 PVC 名严格对应。
      # 只挂 workspaces 子目录，不整挂 /home/appuser/.billy —— 那会把 lark-cli 的本地状态
      # （HOME/.billy/lark-cli）也卷进来，而它的并发写语义没有验证过。
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: billy-agent-runtime-workspaces
      securityContext:
        # Dockerfile 已 `USER appuser`（非 root），这里再做一次显式声明兜底
        runAsNonRoot: true
