apiVersion: v1
kind: Service
metadata:
  name: billy-tool-gateway
  namespace: billy
  labels:
    app.kubernetes.io/name: billy-tool-gateway
    app.kubernetes.io/component: tool-gateway
spec:
  # 内部服务：由 agent-runtime 的工具面调用（TOOL_GATEWAY_URL），不接公网 Ingress。
  # 集群内地址：http://billy-tool-gateway.billy.svc.cluster.local:9993
  type: ClusterIP
  selector:
    app.kubernetes.io/name: billy-tool-gateway
  ports:
    - name: http
      port: 9993
      targetPort: http # 对应容器端口名 http(9993)
      protocol: TCP
      appProtocol: http
  # 网关本身无状态：worker 注册表在 Redis，选路在每次请求里完成
  sessionAffinity: None
