# ─────────────────────────────────────────────
# 两个应用容器共享的运行时环境变量。
#
# 注意：main 与 agent-runtime 必须拿到**完全一致**的 DB / Redis / JWT / 对象存储配置，
# 以及同一个 AGENT_INTERNAL_TOKEN —— 后者是 main 调 runtime 内部接口的凭证，
# 两边不一致时 /internal/agent/* 一律 401。故用 YAML 锚点只维护一份。
# 各服务再用 `environment: <<: *app-env` 合并自己独有的变量（PORT / AGENT_RUNTIME_URL）。
# ─────────────────────────────────────────────
x-app-env: &app-env
  DB_URL: postgresql://root:pg1234@postgres:5432/billy-cli
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
  OBJECT_STORAGE_PROVIDER: s3
  OBJECT_STORAGE_REGION: us-east-1
  OBJECT_STORAGE_BUCKET: billy-cli
  OBJECT_STORAGE_ACCESS_KEY_ID: minioadmin
  OBJECT_STORAGE_SECRET_ACCESS_KEY: minioadmin
  OBJECT_STORAGE_ENDPOINT: http://minio:9000
  # main ↔ agent-runtime 的内部调用令牌；两边必须相同（compose 里默认给本地开发值，生产务必覆盖）
  AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-local-dev-internal-token}
  # 会话工作区：main 文件页、runtime bash、worker 文件工具共用同一个卷
  AGENT_COMMAND_WORK_DIR: /home/appuser/.billy-cli
  # runtime 调模型网关（内部 9992）；runtime 已不再读模型配置表 / 不持供应商 key
  MODEL_GATEWAY_URL: http://model-gateway:9992
  MODEL_INTERNAL_TOKEN: ${MODEL_INTERNAL_TOKEN:-local-dev-model-token}
  MODEL_GATEWAY_TOKEN: ${MODEL_GATEWAY_TOKEN:-local-dev-model-token}
  # runtime / worker 调工具网关
  TOOL_GATEWAY_URL: http://capability-gateway:9993
  TOOL_INTERNAL_TOKEN: ${TOOL_INTERNAL_TOKEN:-local-dev-tool-token}
  TOOL_GATEWAY_TOKEN: ${TOOL_GATEWAY_TOKEN:-local-dev-tool-token}
  # 执行面：bash / file 在工作区里执行；main 的控制面也调它
  WORKSPACE_SERVICE_URL: http://workspace-service:9995
  WORKSPACE_INTERNAL_TOKEN: ${WORKSPACE_INTERNAL_TOKEN:-local-dev-workspace-token}
  # agent 对话的流式内容经 Kafka 从 runtime 转到 main（runtime 发 agent.run.events，main 消费后写 SSE）。
  # 未配置时普通 CRUD 正常，但 /agent/chat/stream 收不到内容。
  # 启用方式：先 `docker compose --profile kafka up -d`，再把下面 KAFKA_BROKERS 设为
  # kafka:9092（容器内 listener）。该变量由 main / agent-runtime 共享，两边值相同。
  KAFKA_BROKERS: ${KAFKA_BROKERS:-}

services:
  # ──────────────────────────────────────────
  # PostgreSQL
  # ──────────────────────────────────────────
  postgres:
    # 带 pgvector 的 PG17（标准镜像没有 vector 扩展；pg_trgm 两个镜像都自带）
    image: pgvector/pgvector:pg17
    container_name: billy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: pg1234
      POSTGRES_DB: billy-cli
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d billy-cli']
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────
  # Redis
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: billy-redis
    restart: unless-stopped
    # AOF：短期记忆 thread 落这里，崩溃最多丢 1 秒；noeviction：内存满时报错而不是静默淘汰记忆
    command: redis-server --save 60 1 --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --loglevel warning
    volumes:
      - redis-data:/data
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # ──────────────────────────────────────────
  # S3-compatible object storage
  # ──────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: billy-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - '19000:9000'
      - '19001:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10

  # ──────────────────────────────────────────
  # Main（NestJS 12 + Express）：公网唯一入口，HTTP/CRUD + Kafka SSE
  # ──────────────────────────────────────────
  main:
    build:
      context: .
      dockerfile: docker/Dockerfile.main
    container_name: billy-main
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # main 的 /agent/* 与 /internal 代理都依赖 runtime；等它健康再起，避免启动期一片 502
      agent-runtime:
        condition: service_healthy
    env_file:
      - apps/main/.env
    environment:
      <<: *app-env
      # 对外端口；容器内与宿主一致（前端 SERVER_URL 与 k8s Service 都按 9989）
      PORT: '9989'
      # 只给 main：通过 compose 服务名调 runtime 的内部 HTTP 入口
      AGENT_RUNTIME_URL: http://agent-runtime:9990
    ports:
      - '9989:9989'
    volumes:
      - workspace-data:/home/appuser/.billy-cli
    healthcheck:
      # /healthz 只证明进程活着，不探 DB / Redis（依赖故障交由 /readyz 与告警处理）
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9989/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────
  # Agent runtime（NestJS 12 + Express）：内部服务，只跑 agent 与工具
  # 不映射宿主端口；需要本机调试时临时取消下面 expose 旁的注释映射。
  # ──────────────────────────────────────────
  agent-runtime:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent-runtime
    container_name: billy-agent-runtime
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      capability-gateway:
        condition: service_healthy
      model-gateway:
        condition: service_healthy
    env_file:
      - apps/agent-runtime/.env
    environment:
      <<: *app-env
      # runtime 的配置 schema 默认端口是 9989（与 main 同源），容器里必须显式改成 9990
      PORT: '9990'
    expose:
      - '9990'
    # ports:
    #   - '9990:9990' # 仅本地调试时打开；生产/CI 不应暴露 runtime
    volumes:
      # 飞书 CLI 连接器的配置与用户授权（/home/appuser/.billy/lark-cli/<实例>）。
      # lark-cli 只装在 runtime 镜像里，卷也只挂 runtime。
      - lark-cli-data:/home/appuser/.billy
      # 会话工作区与 main 文件页 / worker 共用
      - workspace-data:/home/appuser/.billy-cli
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9990/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────
  # DB migration（一次性 Job；@repo/db 的 DataSource）
  # ──────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent-runtime
    container_name: billy-migrate
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: postgresql://root:pg1234@postgres:5432/billy-cli
    command:
      [
        'node',
        'node_modules/typeorm/cli.js',
        'migration:run',
        '-d',
        'node_modules/@repo/db/data-source.mjs',
      ]

  # ──────────────────────────────────────────
  # model-gateway（NestJS）：内部模型网关，canonical OpenAI + 4 套协议适配
  # 只读 ai_providers / ai_models；不暴露宿主端口
  # ──────────────────────────────────────────
  model-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.model-gateway
    container_name: billy-model-gateway
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      PORT: '9992'
      MODEL_GATEWAY_PORT: '9992'
    expose:
      - '9992'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9992/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────
  # Tool gateway / worker（内部工具面，无公网端口）
  # ──────────────────────────────────────────
  common-capability:
    build:
      context: .
      dockerfile: docker/Dockerfile.common-capability
    container_name: billy-common-capability
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      PORT: '9994'
      TOOL_WORKER_PORT: '9994'
      TOOL_WORKER_DB_URL: postgresql://root:pg1234@postgres:5432/billy-cli
      TOOL_WORKER_ENDPOINT: http://common-capability:9994
      TOOL_WORKER_WORKSPACE_ROOT: /home/appuser/.billy-cli
      # compose 的 alpine worker 没有 bwrap / seatbelt；本地一键起用 off，生产按宿主能力设 enforce
      AGENT_WORKSPACE_MODE: off
    expose:
      - '9994'
    volumes:
      - workspace-data:/home/appuser/.billy-cli
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9994/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────
  # Workspace service（AI 执行面：容器生命周期 / exec / fs）
  # ──────────────────────────────────────────
  workspace-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.workspace-service
    container_name: billy-workspace-service
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      PORT: '9995'
      WORKSPACE_SERVICE_PORT: '9995'
      WORKSPACE_DB_URL: postgresql://root:pg1234@postgres:5432/billy-cli
      WORKSPACE_INTERNAL_TOKEN: dev-workspace-token
      WORKSPACE_DEFAULT_IMAGE: billy-workspace:2026.11.0
      WORKSPACE_LOCAL_ROOT: /home/appuser/.billy/workspaces
      # 本地一键起：local 后端没有 OS 沙箱，用 off 仅联调；生产按宿主能力设 enforce
      AGENT_WORKSPACE_MODE: off
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - workspace-data:/home/appuser/.billy/workspaces
    expose:
      - '9995'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9995/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  capability-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.capability-gateway
    container_name: billy-capability-gateway
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      common-capability:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      PORT: '9993'
      TOOL_GATEWAY_PORT: '9993'
      TOOL_WORKER_URL: http://common-capability:9994
    expose:
      - '9993'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9993/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────
  # Admin (Next.js)：只连 main（分享页也挂在 admin）
  # ──────────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
    container_name: billy-admin
    restart: unless-stopped
    depends_on:
      main:
        condition: service_healthy
    environment:
      SERVER_URL: http://main:9989
    ports:
      - '9846:9845'

  # ──────────────────────────────────────────
  # Web (Next.js)：只连 main
  # ──────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: billy-web
    restart: unless-stopped
    depends_on:
      main:
        condition: service_healthy
    environment:
      SERVER_URL: http://main:9989
    ports:
      - '3001:3001'

  # ──────────────────────────────────────────
  # Kafka + 控制台（可选，默认不启动）
  #   docker compose --profile kafka up -d
  # 启用后把 main / agent-runtime 共享的 KAFKA_BROKERS 设为 kafka:9092（容器内 listener），
  # 宿主机应用则用 127.0.0.1:29092。
  # ──────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.4.8
    container_name: billy-kafka
    restart: unless-stopped
    profiles: ['kafka']
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      # 双 listener：容器内 kafka:9092，宿主机 127.0.0.1:29092
      KAFKA_ADVERTISED_LISTENERS: LISTENER_DOCKER_INTERNAL://kafka:9092,LISTENER_DOCKER_EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: LISTENER_DOCKER_INTERNAL:PLAINTEXT,LISTENER_DOCKER_EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: LISTENER_DOCKER_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - '29092:29092'

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: billy-kafka-ui
    restart: unless-stopped
    profiles: ['kafka']
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    ports:
      - '8085:8080'

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.8
    container_name: billy-zookeeper
    restart: unless-stopped
    profiles: ['kafka']
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - '22181:2181'

volumes:
  postgres-data:
  redis-data:
  minio-data:
  lark-cli-data:
  workspace-data:
