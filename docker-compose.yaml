services:
  # ──────────────────────────────────────────
  # PostgreSQL
  # ──────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: billy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: pg1234
      POSTGRES_DB: billy-cli
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d billy-cli']
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────
  # Redis
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: billy-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # ──────────────────────────────────────────
  # S3-compatible object storage
  # ──────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: billy-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - '19000:9000'
      - '19001:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10

  # ──────────────────────────────────────────
  # Server (NestJS 12 + Express)
  # ──────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: billy-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: postgresql://root:pg1234@postgres:5432/billy-cli
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      OBJECT_STORAGE_PROVIDER: s3
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET: billy-cli
      OBJECT_STORAGE_ACCESS_KEY_ID: minioadmin
      OBJECT_STORAGE_SECRET_ACCESS_KEY: minioadmin
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      # 可选：启用 kafka profile 时设为 kafka:9092（容器内 listener）
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
    volumes:
      # 飞书 CLI 连接器的配置与用户授权（/home/appuser/.billy/lark-cli/<实例>）
      - lark-cli-data:/home/appuser/.billy
    ports:
      - '9989:9989'

  # ──────────────────────────────────────────
  # Web (Next.js)
  # ──────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: billy-web
    restart: unless-stopped
    depends_on:
      - server
    environment:
      SERVER_URL: http://server:9989
    ports:
      - '3001:3001'

  # ──────────────────────────────────────────
  # Kafka + 控制台（可选，默认不启动）
  #   docker compose --profile kafka up -d
  # 启用后把 server 的 KAFKA_BROKERS 设为 kafka:9092，宿主机应用则用 127.0.0.1:29092。
  # ──────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.4.8
    container_name: billy-kafka
    restart: unless-stopped
    profiles: ['kafka']
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      # 双 listener：容器内 kafka:9092，宿主机 127.0.0.1:29092
      KAFKA_ADVERTISED_LISTENERS: LISTENER_DOCKER_INTERNAL://kafka:9092,LISTENER_DOCKER_EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: LISTENER_DOCKER_INTERNAL:PLAINTEXT,LISTENER_DOCKER_EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: LISTENER_DOCKER_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - '29092:29092'

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: billy-kafka-ui
    restart: unless-stopped
    profiles: ['kafka']
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    ports:
      - '8085:8080'

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.8
    container_name: billy-zookeeper
    restart: unless-stopped
    profiles: ['kafka']
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - '22181:2181'

volumes:
  postgres-data:
  redis-data:
  minio-data:
  lark-cli-data:
